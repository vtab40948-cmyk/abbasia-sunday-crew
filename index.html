<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abbasia Sunday Crew (Grades 5 & 6)</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Favicon and Home Screen Icon -->
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">

  <!-- Mobile Web App Meta -->
  <meta name="theme-color" content="#62C4DA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sunday Crew">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Firebase App & Firestore SDKs (Compatibility Build) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --honeydew: #F6FFEA;
      --soft-peach: #FFDE96;
      --coral-glow: #FA855A;
      --tomato-jam: #C93638;
      --sky-blue: #62C4DA;
      --dark-ink: #1A202C;
    }

    body {
      font-family: 'Cairo', 'Fredoka', sans-serif;
      background-color: #F8FAF6;
      background-image: radial-gradient(var(--sky-blue) 1.5px, transparent 1.5px);
      background-size: 18px 18px;
      color: var(--dark-ink);
    }

    .comic-card {
      background: #FFFFFF;
      border: 3px solid var(--dark-ink);
      box-shadow: 5px 5px 0px var(--dark-ink);
      border-radius: 18px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .comic-card:hover {
      transform: translateY(-2px);
      box-shadow: 7px 7px 0px var(--dark-ink);
    }

    .comic-btn {
      border: 3px solid var(--dark-ink);
      box-shadow: 4px 4px 0px var(--dark-ink);
      font-weight: 800;
      border-radius: 14px;
      transition: all 0.1s ease;
    }

    .comic-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px var(--dark-ink);
    }

    .comic-input {
      border: 3px solid var(--dark-ink);
      border-radius: 12px;
      outline: none;
      font-weight: 600;
    }

    .comic-input:focus {
      border-color: var(--coral-glow);
      box-shadow: 0 0 0 3px rgba(250, 133, 90, 0.3);
    }

    .badge-pop {
      border: 2px solid var(--dark-ink);
      box-shadow: 2px 2px 0px var(--dark-ink);
    }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- Navigation Bar -->
  <header class="sticky top-0 z-40 bg-[#FFFFFF]/95 backdrop-blur border-b-4 border-[#1A202C] px-4 py-3 mb-6">
    <div class="max-w-5xl mx-auto flex flex-wrap justify-between items-center gap-3">
      
      <!-- Brand Header -->
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-[#FFDE96] border-3 border-[#1A202C] shadow-[3px_3px_0px_#1A202C] flex items-center justify-center text-2xl font-black">
          <svg class="w-8 h-8 text-[#C93638]" viewBox="0 0 24 24" fill="currentColor">
            <path d="M11 2h2v7h7v2h-7v11h-2V11H4V9h7V2z"/>
          </svg>
        </div>
        <div>
          <h1 id="appTitle" class="text-xl md:text-2xl font-black tracking-tight leading-none text-[#1A202C]">
            رحلتي مع يسوع
          </h1>
          <p id="appSubTitle" class="text-xs font-bold text-[#FA855A]">
            فصل أبطال الإيمان - الكنيسة الإنجيلية بالعباسية (فصل 5 و 6)
          </p>
        </div>
      </div>

      <!-- Control Badges -->
      <div class="flex items-center gap-2">
        <!-- Language Switcher -->
        <button onclick="toggleLanguage()" class="comic-btn bg-[#62C4DA] text-white px-3 py-1.5 text-xs md:text-sm flex items-center gap-1">
          🌐 <span id="langBtnLabel">English</span>
        </button>

        <!-- Mode Toggle -->
        <button id="modeToggleBtn" onclick="promptLeaderAuth()" class="comic-btn bg-[#FFDE96] text-[#1A202C] px-3 py-1.5 text-xs md:text-sm flex items-center gap-1">
          🔐 <span id="modeBtnLabel">دخول الخدام</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-5xl mx-auto px-4">
    <div id="mainAppContent">
      <div class="text-center py-12">
        <p class="text-lg font-bold text-gray-600">جاري تحميل البيانات من السحابة...</p>
      </div>
    </div>
  </main>

  <!-- Leader Auth Modal -->
  <div id="leaderAuthModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="comic-card bg-white p-6 max-w-sm w-full relative">
      <h3 id="leaderAuthTitle" class="text-xl font-black mb-4 text-center">تسجيل دخول الخدام 🔐</h3>
      
      <div class="space-y-3 mb-4">
        <div>
          <label id="lblUsername" class="block text-xs font-bold mb-1">اسم المستخدم</label>
          <input type="text" id="leaderUsernameInput" class="comic-input w-full p-2.5 text-sm" placeholder="leader">
        </div>
        <div>
          <label id="lblPassword" class="block text-xs font-bold mb-1">كلمة السر</label>
          <input type="password" id="leaderPassInput" class="comic-input w-full p-2.5 text-sm" placeholder="••••">
        </div>
      </div>

      <div class="flex gap-2">
        <button onclick="loginLeader()" class="comic-btn bg-[#FA855A] text-white flex-1 py-2 text-sm">دخول</button>
        <button onclick="closeLeaderModal()" class="comic-btn bg-gray-200 text-gray-800 flex-1 py-2 text-sm">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // 1. Initialize Firebase with exact credentials
    const firebaseConfig = {
      apiKey: "AIzaSyAeZYcwUjNJqUOfn3lsrBL6N2V0j8oVKNc",
      authDomain: "abbasia-sunday-crew.firebaseapp.com",
      projectId: "abbasia-sunday-crew",
      storageBucket: "abbasia-sunday-crew.firebasestorage.app",
      messagingSenderId: "546561455599",
      appId: "1:546561455599:web:8b214cbfdd1c5daab3321a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // App State
    let currentLang = 'ar';
    let isLeaderMode = false;
    let loggedInStudentId = localStorage.getItem('sunday_crew_student_id') || null;
    let leaderTab = 'students';
    let leaderboardTab = 'students';

    // Cloud Data Sync Structure
    let appData = {
      students: [],
      leaders: [{ username: 'leader', pass: '5626' }],
      quietTimeSchedule: {
        0: '', 1: '', 2: '', 3: '', 4: '', 5: '', 6: ''
      },
      memoryTasks: [],
      announcements: [],
      attendanceRecords: {},
      classGoals: [
        { id: 1, name: 'Movie Party', points: 10000 },
        { id: 2, name: 'Restaurant Trip', points: 15000 },
        { id: 3, name: 'Sports Day', points: 20000 },
        { id: 4, name: 'Football Pitch Rent', points: 25000 },
        { id: 5, name: 'Major Trip', points: 50000 }
      ]
    };

    // Translations Dictionary
    const i18n = {
      ar: {
        appTitle: "رحلتي مع يسوع",
        appSubTitle: "فصل أبطال الإيمان - الكنيسة الإنجيلية بالعباسية (فصل 5 و 6)",
        langBtnLabel: "English",
        modeLeaderBtn: "دخول الخدام 🔐",
        modeStudentBtn: "خروج الخادم 🚪",
        studentLoginTitle: "تسجيل دخول البطل 🌟",
        namePlaceholder: "اسمك الثلاثي",
        birthdayLabel: "تاريخ ميلادك 🎂",
        roleLabel: "فريقتك في الفصل 🤝",
        loginBtn: "انطلق للخدمة! 🚀",
        welcomeHero: "أهلاً بك يا بطل",
        leaderPanelTitle: "لوحة تحكم الخدام 🛠️",
        studentMonitorTab: "متابعة الطلاب 👥",
        qtScheduleTab: "الخلوة اليومية 📖",
        memoryTab: "التسميع 📜",
        announcementsTab: "الإعلانات 📢",
        attendanceTab: "الحضور 🗓️",
        goalsTab: "أهداف الفصل 🎯"
      },
      en: {
        appTitle: "My Journey with Jesus",
        appSubTitle: "Faith Heroes Class - Evangelical Church in Abbasia (Grades 5 & 6)",
        langBtnLabel: "عربي",
        modeLeaderBtn: "Leader Login 🔐",
        modeStudentBtn: "Exit Leader Mode 🚪",
        studentLoginTitle: "Hero Registration 🌟",
        namePlaceholder: "Full Name",
        birthdayLabel: "Your Birthday 🎂",
        roleLabel: "Serving Team in Class 🤝",
        loginBtn: "Let's Go! 🚀",
        welcomeHero: "Welcome Hero",
        leaderPanelTitle: "Leader Control Panel 🛠️",
        studentMonitorTab: "Students Roster 👥",
        qtScheduleTab: "Quiet Time 📖",
        memoryTab: "Recitations 📜",
        announcementsTab: "Announcements 📢",
        attendanceTab: "Attendance 🗓️",
        goalsTab: "Class Goals 🎯"
      }
    };

    // Real-Time Cloud Listener
    function startCloudSync() {
      db.collection('app_settings').doc('main_data').onSnapshot((doc) => {
        if (doc.exists) {
          appData = doc.data();
        } else {
          saveDataToCloud();
        }
        renderCurrentView();
      });
    }

    function saveDataToCloud() {
      db.collection('app_settings').doc('main_data').set(appData);
    }

    // Toggle Language
    function toggleLanguage() {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      document.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      renderCurrentView();
    }

    // Prompt Leader Login
    function promptLeaderAuth() {
      if (isLeaderMode) {
        isLeaderMode = false;
        renderCurrentView();
      } else {
        document.getElementById('leaderAuthModal').classList.remove('hidden');
      }
    }

    function closeLeaderModal() {
      document.getElementById('leaderAuthModal').classList.add('hidden');
    }

    function loginLeader() {
      const user = document.getElementById('leaderUsernameInput').value.trim();
      const pass = document.getElementById('leaderPassInput').value.trim();

      const found = appData.leaders.find(l => l.username === user && l.pass === pass);
      if (found) {
        isLeaderMode = true;
        closeLeaderModal();
        renderCurrentView();
      } else {
        alert(currentLang === 'ar' ? 'اسم المستخدم أو كلمة السر غير صحيحة' : 'Invalid leader credentials');
      }
    }

    // Main UI Router
    function renderCurrentView() {
      const t = i18n[currentLang];
      document.getElementById('appTitle').innerText = t.appTitle;
      document.getElementById('appSubTitle').innerText = t.appSubTitle;
      document.getElementById('langBtnLabel').innerText = t.langBtnLabel;
      document.getElementById('modeBtnLabel').innerText = isLeaderMode ? t.modeStudentBtn : t.modeLeaderBtn;

      const container = document.getElementById('mainAppContent');

      if (isLeaderMode) {
        renderLeaderDashboard(container);
      } else if (!loggedInStudentId || !appData.students.find(s => s.id === loggedInStudentId)) {
        renderStudentRegistration(container);
      } else {
        renderStudentDashboard(container);
      }
    }

    // Render Student Login
    function renderStudentRegistration(container) {
      const t = i18n[currentLang];
      container.innerHTML = `
        <div class="comic-card p-6 md:p-8 max-w-md mx-auto my-8 bg-white">
          <h2 class="text-2xl font-black text-center mb-6 text-[#1A202C] flex items-center justify-center gap-2">
            <span>✨</span> ${t.studentLoginTitle}
          </h2>
          <form onsubmit="handleStudentRegister(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-black mb-1">الاسم الكامل / Name</label>
              <input type="text" id="regName" required class="comic-input w-full p-3 text-sm" placeholder="${t.namePlaceholder}">
            </div>
            <div>
              <label class="block text-xs font-black mb-1">${t.birthdayLabel}</label>
              <input type="date" id="regBday" required class="comic-input w-full p-3 text-sm">
            </div>
            <div>
              <label class="block text-xs font-black mb-1">${t.roleLabel}</label>
              <select id="regRole" required class="comic-input w-full p-3 text-sm bg-white">
                <option value="Greeting">فريق الاستقبال 🤝 Greeting</option>
                <option value="Worship">فريق التسبيح 🎵 Worship</option>
                <option value="Media">فريق الميديا 📸 Media</option>
                <option value="Crafts">فريق الأشغال اليدوية 🎨 Crafts</option>
                <option value="Games">فريق الالعاب 🎮 Games</option>
              </select>
            </div>
            <button type="submit" class="comic-btn w-full bg-[#FA855A] text-white py-3 text-base mt-4">
              ${t.loginBtn}
            </button>
          </form>
        </div>
      `;
    }

    function handleStudentRegister(e) {
      e.preventDefault();
      const newStudent = {
        id: 'std_' + Date.now(),
        name: document.getElementById('regName').value.trim(),
        bday: document.getElementById('regBday').value,
        role: document.getElementById('regRole').value,
        team: 'Unassigned',
        points: 0,
        reflections: [],
        recitationsCompleted: [],
        attendanceCount: 0
      };

      appData.students.push(newStudent);
      loggedInStudentId = newStudent.id;
      localStorage.setItem('sunday_crew_student_id', newStudent.id);
      saveDataToCloud();
    }

    // Render Student Main App
    function renderStudentDashboard(container) {
      const student = appData.students.find(s => s.id === loggedInStudentId);
      const todayDay = new Date().getDay();
      const todayQT = appData.quietTimeSchedule[todayDay] || '';

      container.innerHTML = `
        <!-- Student Header -->
        <div class="comic-card bg-[#FFDE96] p-5 mb-6 flex flex-wrap justify-between items-center gap-4">
          <div>
            <div class="flex items-center gap-2 mb-1">
              <span class="badge-pop bg-[#FA855A] text-white text-xs px-2.5 py-0.5 rounded-full font-bold">${student.role}</span>
              <span class="badge-pop bg-[#62C4DA] text-white text-xs px-2.5 py-0.5 rounded-full font-bold">فريق: ${student.team}</span>
            </div>
            <h2 class="text-2xl font-black">${student.name}</h2>
          </div>
          <div class="comic-card bg-white px-4 py-2 text-center">
            <span class="text-xs font-bold text-gray-500 block">نقاطي</span>
            <span class="text-2xl font-black text-[#C93638]">${student.points} ⭐</span>
          </div>
        </div>

        <!-- Leaderboard Tabs -->
        <div class="comic-card bg-white p-6 mb-6">
          <h3 class="text-lg font-black mb-4 flex items-center gap-2">🏆 لوحة الصدارة</h3>
          <div class="flex gap-2 mb-4 border-b-2 border-gray-200 pb-2">
            <button onclick="setLBTab('students')" class="comic-btn px-4 py-1.5 text-xs ${leaderboardTab === 'students' ? 'bg-[#FA855A] text-white' : 'bg-gray-100'}">الطلاب</button>
            <button onclick="setLBTab('teams')" class="comic-btn px-4 py-1.5 text-xs ${leaderboardTab === 'teams' ? 'bg-[#FA855A] text-white' : 'bg-gray-100'}">الفرق</button>
          </div>
          ${renderLeaderboardContent()}
        </div>

        <!-- Daily Quiet Time -->
        <div class="comic-card bg-white p-6 mb-6">
          <h3 class="text-lg font-black mb-2 flex items-center gap-2">📖 خلوة اليوم (+10 نقاط)</h3>
          <p class="text-sm font-bold bg-[#F6FFEA] p-3 border-2 border-[#1A202C] rounded-xl mb-4">
            ${todayQT ? todayQT : 'لم يتم تحديد قراءة اليوم بعد من الخدام.'}
          </p>
          <form onsubmit="submitReflection(event)" class="space-y-3">
            <input type="text" id="qtVerse" required class="comic-input w-full p-2.5 text-xs" placeholder="آية لمست قلبي اليوم...">
            <textarea id="qtPrayer" required class="comic-input w-full p-2.5 text-xs" rows="2" placeholder="صلاة / فكرة أثرت فيا..."></textarea>
            <button type="submit" class="comic-btn bg-[#62C4DA] text-white px-4 py-2 text-xs">إرسال الخلوة للخدام ✨</button>
          </form>
        </div>
      `;
    }

    function setLBTab(tab) {
      leaderboardTab = tab;
      renderCurrentView();
    }

    function renderLeaderboardContent() {
      if (leaderboardTab === 'students') {
        const sorted = [...appData.students].sort((a,b) => b.points - a.points);
        if (sorted.length === 0) return '<p class="text-xs text-gray-500">لا يوجد طلاب مسجلين حتى الآن.</p>';
        return `
          <div class="space-y-2">
            ${sorted.map((s, idx) => `
              <div class="flex justify-between items-center p-2.5 bg-gray-50 border-2 border-[#1A202C] rounded-xl">
                <span class="font-bold text-sm">#${idx+1}${s.name}</span>
                <span class="font-black text-sm text-[#FA855A]">${s.points} pt</span>
              </div>
            `).join('')}
          </div>
        `;
      } else {
        const teams = { Lions: 0, Eagles: 0, Falcons: 0 };
        appData.students.forEach(s => {
          if (teams[s.team] !== undefined) teams[s.team] += s.points;
        });
        return `
          <div class="grid grid-cols-3 gap-3 text-center">
            <div class="comic-card bg-[#FFDE96] p-3">
              <span class="block text-2xl mb-1">🦁</span>
              <span class="text-xs font-bold block">Lions</span>
              <span class="text-lg font-black">${teams.Lions}</span>
            </div>
            <div class="comic-card bg-[#62C4DA] text-white p-3">
              <span class="block text-2xl mb-1">🦅</span>
              <span class="text-xs font-bold block">Eagles</span>
              <span class="text-lg font-black">${teams.Eagles}</span>
            </div>
            <div class="comic-card bg-[#FA855A] text-white p-3">
              <span class="block text-2xl mb-1">⚡</span>
              <span class="text-xs font-bold block">Falcons</span>
              <span class="text-lg font-black">${teams.Falcons}</span>
            </div>
          </div>
        `;
      }
    }

    function submitReflection(e) {
      e.preventDefault();
      const verse = document.getElementById('qtVerse').value.trim();
      const prayer = document.getElementById('qtPrayer').value.trim();
      const student = appData.students.find(s => s.id === loggedInStudentId);

      student.reflections.push({
        date: new Date().toLocaleDateString(),
        verse,
        prayer,
        reviewed: false
      });

      saveDataToCloud();
      confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
      alert('تم إرسال الخلوة بنجاح! سيتم إضافة النقاط بعد مراجعة الخادم.');
    }

    // Render Leader Dashboard
    function renderLeaderDashboard(container) {
      const t = i18n[currentLang];
      container.innerHTML = `
        <div class="comic-card bg-[#1A202C] text-white p-6 mb-6">
          <div class="flex justify-between items-center flex-wrap gap-3">
            <div>
              <h2 class="text-xl font-black text-[#FFDE96]">${t.leaderPanelTitle}</h2>
              <p class="text-xs text-gray-300">مرحباً بالخادم في لوحة التحكم المركزية</p>
            </div>
            <button onclick="addNewLeaderPrompt()" class="comic-btn bg-[#62C4DA] text-white text-xs px-3 py-1.5">+ إضافة خادم جديد</button>
          </div>
        </div>

        <!-- Leader Tabs -->
        <div class="flex flex-wrap gap-2 mb-6">
          <button onclick="setLeaderTab('students')" class="comic-btn px-4 py-2 text-xs ${leaderTab === 'students' ? 'bg-[#FA855A] text-white' : 'bg-white'}">${t.studentMonitorTab}</button>
          <button onclick="setLeaderTab('qt')" class="comic-btn px-4 py-2 text-xs ${leaderTab === 'qt' ? 'bg-[#FA855A] text-white' : 'bg-white'}">${t.qtScheduleTab}</button>
        </div>

        <!-- Tab Content -->
        <div class="comic-card bg-white p-6">
          ${leaderTab === 'students' ? renderLeaderStudentsTab() : renderLeaderQTTab()}
        </div>
      `;
    }

    function setLeaderTab(tab) {
      leaderTab = tab;
      renderCurrentView();
    }

    function renderLeaderStudentsTab() {
      if (appData.students.length === 0) {
        return '<p class="text-xs text-gray-500 text-center py-4">لا يوجد طلاب مسجلين حتى الآن في الخدمة.</p>';
      }

      return `
        <div class="space-y-4">
          ${appData.students.map(s => `
            <div class="border-2 border-[#1A202C] rounded-xl p-4 bg-gray-50 flex flex-wrap justify-between items-center gap-3">
              <div>
                <h4 class="font-black text-sm">${s.name}</h4>
                <div class="text-xs text-gray-600 space-x-2 space-x-reverse mt-1">
                  <span>🎂 ${s.bday}</span> | 
                  <span>🤝 ${s.role}</span> | 
                  <span class="font-bold text-[#C93638]">⭐ ${s.points} pts</span>
                </div>
              </div>

              <div class="flex items-center gap-2 flex-wrap">
                <!-- Change Team -->
                <select onchange="updateStudentTeam('${s.id}', this.value)" class="comic-input p-1.5 text-xs bg-white">
                  <option value="Unassigned" ${s.team === 'Unassigned' ? 'selected' : ''}>بدون فريق</option>
                  <option value="Lions" ${s.team === 'Lions' ? 'selected' : ''}>🦁 Lions</option>
                  <option value="Eagles" ${s.team === 'Eagles' ? 'selected' : ''}>🦅 Eagles</option>
                  <option value="Falcons" ${s.team === 'Falcons' ? 'selected' : ''}>⚡ Falcons</option>
                </select>

                <!-- Add Points -->
                <button onclick="addStudentPoints('${s.id}', 10)" class="comic-btn bg-[#62C4DA] text-white text-xs px-2.5 py-1.5">+10 pts</button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function updateStudentTeam(stdId, newTeam) {
      const s = appData.students.find(std => std.id === stdId);
      if (s) {
        s.team = newTeam;
        saveDataToCloud();
      }
    }

    function addStudentPoints(stdId, amount) {
      const s = appData.students.find(std => std.id === stdId);
      if (s) {
        s.points += amount;
        saveDataToCloud();
      }
    }

    function renderLeaderQTTab() {
      const days = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
      return `
        <div class="space-y-3">
          <h4 class="font-black text-sm mb-3">جدول قراءات الخلوة الأسبوعي:</h4>
          ${days.map((day, idx) => `
            <div class="flex items-center gap-3">
              <span class="w-16 font-bold text-xs">${day}:</span>
              <input type="text" value="${appData.quietTimeSchedule[idx] \vert{}\vert{} ''}" onchange="updateQTSchedule(${idx}, this.value)" class="comic-input flex-1 p-2 text-xs" placeholder="مثال: يوحنا 3: 16">
            </div>
          `).join('')}
        </div>
      `;
    }

    function updateQTSchedule(dayIdx, val) {
      appData.quietTimeSchedule[dayIdx] = val;
      saveDataToCloud();
    }

    function addNewLeaderPrompt() {
      const u = prompt('ادخل اسم الخادم الجديد:');
      const p = prompt('ادخل كلمة السر:');
      if (u && p) {
        appData.leaders.push({ username: u.trim(), pass: p.trim() });
        saveDataToCloud();
        alert('تمت إضافة الخادم بنجاح!');
      }
    }

    // Start App & Sync
    startCloudSync();
  </script>
</body>
</html>
